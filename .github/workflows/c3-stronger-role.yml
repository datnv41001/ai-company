name: C3 matched 7B role evaluation
on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  role-comparison:
    if: >-
      github.event_name == 'pull_request' &&
      github.repository == 'datnv41001/ai-company' &&
      github.event.repository.private == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'feature/marketing-product-qualification' &&
      inputs.source_sha == github.sha
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: c3-stronger-role-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check study is still open
        id: study
        run: |
          if test -f docs/evaluation/c3-product-v2/RESULTS.md; then
            echo 'active=false' >> "$GITHUB_OUTPUT"
            echo 'Qualification dossier already recorded for this branch.'
          else
            echo 'active=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.study.outputs.active == 'true'
        with:
          python-version: '3.12'
      - name: Read the synthetic study from this integration run
        if: steps.study.outputs.active == 'true'
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: pool-model-measurements-integration
          path: evidence
      - name: Install pinned application dependencies
        if: steps.study.outputs.active == 'true'
        run: python -m pip install -r requirements.txt
      - name: Compare the selected role on the same checkout
        if: steps.study.outputs.active == 'true'
        run: python tests/evaluation/c3/stronger_role.py evidence/c3-product-v2 c3-stronger-role
      - name: Preserve the latest completed receipt
        if: always() && steps.study.outputs.active == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: c3-stronger-role-${{ github.sha }}
          path: c3-stronger-role
          if-no-files-found: error
      - name: Release the local model
        if: always() && steps.study.outputs.active == 'true'
        run: docker rm -f c3-stronger >/dev/null 2>&1 || true

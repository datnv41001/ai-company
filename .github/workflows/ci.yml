name: Verify bootstrap
on:
  push:
  pull_request:
jobs:
  api-tests:
    strategy: &revision_strategy
      fail-fast: false
      matrix:
        revision: ${{ fromJSON(github.event_name == 'pull_request' && '["head","integration"]' || '["head"]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: &tested_revision ${{ matrix.revision == 'integration' && github.sha || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.16'
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check app tests migrations scripts
      - name: Test SQLite and PostgreSQL isolation
        shell: bash
        run: |
          set -euo pipefail
          export POSTGRES_PASSWORD="$(openssl rand -hex 32)"
          export AMC_RUNTIME_PASSWORD="$(openssl rand -hex 32)"
          export JWT_SECRET="$(openssl rand -hex 48)"
          export AMC_DB_PROOF_KEY="$(openssl rand -hex 32)"
          export AMC_SESSION_GENERATION="$(openssl rand -hex 32)"
          export AMC_QUOTA_KEY="$(python -c 'import hmac,os;print(hmac.digest(os.environ["JWT_SECRET"].encode(),b"amc/identity-quota/v1","sha256").hex())')"
          docker run --detach --rm --name amc-test-pg -e POSTGRES_PASSWORD -e POSTGRES_DB=amc_test_ci \
            -p 127.0.0.1::5432 postgres:16-alpine
          trap 'docker stop amc-test-pg >/dev/null' EXIT
          for i in {1..60}; do
            if docker exec amc-test-pg pg_isready -h 127.0.0.1 -U postgres; then break; fi
            sleep 1
          done
          port="$(docker port amc-test-pg 5432/tcp | cut -d: -f2)"
          export AMC_MIGRATION_DSN="postgresql://postgres:$POSTGRES_PASSWORD@127.0.0.1:$port/amc_test_ci"
          export DATABASE_URL="postgresql+psycopg://amc_runtime:$AMC_RUNTIME_PASSWORD@127.0.0.1:$port/amc_test_ci"
          export AMC_TEST_PG=1 PYTHONPATH=.
          python migrations/apply.py
          AMC_WF03_HOLD_EVIDENCE="$RUNNER_TEMP/wf03-holds" python -m pytest -q
          python -c 'import os, sys; sys.path.insert(0, "tests"); from check_postgres_upgrade import rehearse_archive; rehearse_archive(os.environ["AMC_MIGRATION_DSN"], "amc-test-pg", 23)'
          docker exec amc-test-pg createdb -U postgres amc_test_upgrade
          export AMC_MIGRATION_DSN="${AMC_MIGRATION_DSN%/*}/amc_test_upgrade"
          export DATABASE_URL="${DATABASE_URL%/*}/amc_test_upgrade"
          python tests/check_postgres_upgrade.py

          docker exec amc-test-pg createdb -U postgres amc_test_populated_v2
          export AMC_MIGRATION_DSN="${AMC_MIGRATION_DSN%/*}/amc_test_populated_v2"
          export DATABASE_URL="${DATABASE_URL%/*}/amc_test_populated_v2"
          python tests/check_postgres_upgrade.py --from-v2
          docker exec amc-test-pg createdb -U postgres amc_test_populated_v3
          export AMC_MIGRATION_DSN="${AMC_MIGRATION_DSN%/*}/amc_test_populated_v3"
          export DATABASE_URL="${DATABASE_URL%/*}/amc_test_populated_v3"
          python tests/check_postgres_upgrade.py --from-v3
          docker exec amc-test-pg createdb -U postgres amc_test_populated_v4
          export AMC_MIGRATION_DSN="${AMC_MIGRATION_DSN%/*}/amc_test_populated_v4"
          export DATABASE_URL="${DATABASE_URL%/*}/amc_test_populated_v4"
          python tests/check_postgres_upgrade.py --from-v4
          docker exec amc-test-pg createdb -U postgres amc_test_populated_v5
          export AMC_MIGRATION_DSN="${AMC_MIGRATION_DSN%/*}/amc_test_populated_v5"
          export DATABASE_URL="${DATABASE_URL%/*}/amc_test_populated_v5"
          python tests/check_postgres_upgrade.py --from-v5
          docker exec amc-test-pg createdb -U postgres amc_test_populated_v6
          export AMC_MIGRATION_DSN="${AMC_MIGRATION_DSN%/*}/amc_test_populated_v6"
          export DATABASE_URL="${DATABASE_URL%/*}/amc_test_populated_v6"
          python tests/check_postgres_upgrade.py --from-v6
          docker exec amc-test-pg createdb -U postgres amc_test_populated_v7
          export AMC_MIGRATION_DSN="${AMC_MIGRATION_DSN%/*}/amc_test_populated_v7"
          export DATABASE_URL="${DATABASE_URL%/*}/amc_test_populated_v7"
          python tests/check_postgres_upgrade.py --from-v7
          docker exec amc-test-pg createdb -U postgres amc_test_populated_v8
          export AMC_MIGRATION_DSN="${AMC_MIGRATION_DSN%/*}/amc_test_populated_v8"
          export DATABASE_URL="${DATABASE_URL%/*}/amc_test_populated_v8"
          python tests/check_postgres_upgrade.py --from-v8
          docker exec amc-test-pg createdb -U postgres amc_test_populated_v9
          export AMC_MIGRATION_DSN="${AMC_MIGRATION_DSN%/*}/amc_test_populated_v9"
          export DATABASE_URL="${DATABASE_URL%/*}/amc_test_populated_v9"
          python tests/check_postgres_upgrade.py --from-v9
          docker exec amc-test-pg createdb -U postgres amc_test_populated_v10
          export AMC_MIGRATION_DSN="${AMC_MIGRATION_DSN%/*}/amc_test_populated_v10"
          export DATABASE_URL="${DATABASE_URL%/*}/amc_test_populated_v10"
          python tests/check_postgres_upgrade.py --from-v10
          docker exec amc-test-pg createdb -U postgres amc_test_populated_v11
          export AMC_MIGRATION_DSN="${AMC_MIGRATION_DSN%/*}/amc_test_populated_v11"
          export DATABASE_URL="${DATABASE_URL%/*}/amc_test_populated_v11"
          python tests/check_postgres_upgrade.py --from-v11
          docker exec amc-test-pg createdb -U postgres amc_test_populated_v12
          export AMC_MIGRATION_DSN="${AMC_MIGRATION_DSN%/*}/amc_test_populated_v12"
          export DATABASE_URL="${DATABASE_URL%/*}/amc_test_populated_v12"
          python tests/check_postgres_upgrade.py --from-v12
          docker exec amc-test-pg createdb -U postgres amc_test_populated_v13
          export AMC_MIGRATION_DSN="${AMC_MIGRATION_DSN%/*}/amc_test_populated_v13"
          export DATABASE_URL="${DATABASE_URL%/*}/amc_test_populated_v13"
          python tests/check_postgres_upgrade.py --from-v13
          docker exec amc-test-pg createdb -U postgres amc_test_populated_v14
          export AMC_MIGRATION_DSN="${AMC_MIGRATION_DSN%/*}/amc_test_populated_v14"
          export DATABASE_URL="${DATABASE_URL%/*}/amc_test_populated_v14"
          python tests/check_postgres_upgrade.py --from-v14
          docker exec amc-test-pg createdb -U postgres amc_test_populated_v15
          export AMC_MIGRATION_DSN="${AMC_MIGRATION_DSN%/*}/amc_test_populated_v15"
          export DATABASE_URL="${DATABASE_URL%/*}/amc_test_populated_v15"
          python tests/check_postgres_upgrade.py --from-v15
          docker exec amc-test-pg createdb -U postgres amc_test_populated_v16
          export AMC_MIGRATION_DSN="${AMC_MIGRATION_DSN%/*}/amc_test_populated_v16"
          export DATABASE_URL="${DATABASE_URL%/*}/amc_test_populated_v16"
          AMC_UPGRADE_BACKUP_CONTAINER=amc-test-pg python tests/check_postgres_upgrade.py --from-v16
          docker exec amc-test-pg createdb -U postgres amc_test_populated_v17
          export AMC_MIGRATION_DSN="${AMC_MIGRATION_DSN%/*}/amc_test_populated_v17"
          export DATABASE_URL="${DATABASE_URL%/*}/amc_test_populated_v17"
          python tests/check_postgres_upgrade.py --from-v17
          docker exec amc-test-pg createdb -U postgres amc_test_populated_v18
          export AMC_MIGRATION_DSN="${AMC_MIGRATION_DSN%/*}/amc_test_populated_v18"
          export DATABASE_URL="${DATABASE_URL%/*}/amc_test_populated_v18"
          AMC_UPGRADE_BACKUP_CONTAINER=amc-test-pg python tests/check_postgres_upgrade.py --from-v18
          docker exec amc-test-pg createdb -U postgres amc_test_populated_v19
          export AMC_MIGRATION_DSN="${AMC_MIGRATION_DSN%/*}/amc_test_populated_v19"
          export DATABASE_URL="${DATABASE_URL%/*}/amc_test_populated_v19"
          AMC_UPGRADE_BACKUP_CONTAINER=amc-test-pg python tests/check_postgres_upgrade.py --from-v19
          docker exec amc-test-pg createdb -U postgres amc_test_populated_v20
          export AMC_MIGRATION_DSN="${AMC_MIGRATION_DSN%/*}/amc_test_populated_v20"
          export DATABASE_URL="${DATABASE_URL%/*}/amc_test_populated_v20"
          AMC_UPGRADE_BACKUP_CONTAINER=amc-test-pg python tests/check_postgres_upgrade.py --from-v20
          docker exec amc-test-pg createdb -U postgres amc_test_populated_v21
          export AMC_MIGRATION_DSN="${AMC_MIGRATION_DSN%/*}/amc_test_populated_v21"
          export DATABASE_URL="${DATABASE_URL%/*}/amc_test_populated_v21"
          AMC_UPGRADE_BACKUP_CONTAINER=amc-test-pg python tests/check_postgres_upgrade.py --from-v21
          docker exec amc-test-pg createdb -U postgres amc_test_populated_v22
          export AMC_MIGRATION_DSN="${AMC_MIGRATION_DSN%/*}/amc_test_populated_v22"
          export DATABASE_URL="${DATABASE_URL%/*}/amc_test_populated_v22"
          AMC_UPGRADE_BACKUP_CONTAINER=amc-test-pg python tests/check_postgres_upgrade.py --from-v22
          docker exec amc-test-pg createdb -U postgres amc_test_isolated_v16
          export AMC_MIGRATION_DSN="${AMC_MIGRATION_DSN%/*}/amc_test_isolated_v16"
          export DATABASE_URL="${DATABASE_URL%/*}/amc_test_isolated_v16"
          python tests/check_postgres_upgrade.py --from-isolated-v16
      - uses: actions/upload-artifact@v4
        with:
          name: wf03-director-ledger${{ matrix.revision == 'integration' && '-integration' || '' }}
          path: ${{ runner.temp }}/wf03-holds/*.json
          if-no-files-found: error
  compose-browser:
    strategy: *revision_strategy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: *tested_revision
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.16'
      - run: python -m pip install -r requirements-browser.txt -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - name: Rehearse a fresh-machine handoff
        shell: bash
        run: |
          set -euo pipefail
          python scripts/init_env.py
          docker compose -p amc-acceptance config -q
          OPENAI_API_KEY=synthetic-only docker compose -p amc-acceptance --profile workforce config --format json | python -c "import json,sys
          services=json.load(sys.stdin)['services']
          for name,service in services.items():
              env=service.get('environment',{})
              assert 'OPENAI_API_KEY' not in env
              assert ('AMC_WORKER_KEY_FILE' in env)==(name=='worker')
              if name=='worker': assert not {'JWT_SECRET','AMC_DB_PROOF_KEY','AMC_QUOTA_KEY','AMC_SESSION_GENERATION'} & set(env)
              assert any(v.get('target')=='/run/amc-worker-secrets' and v.get('read_only') for v in service.get('volumes',[]))==(name=='worker')"
          trap 'docker compose -p amc-acceptance down' EXIT
          docker compose -p amc-acceptance up -d --build
          # Docker can accept the TCP connection while Uvicorn is still starting.
          if ! curl --fail --retry 30 --retry-all-errors --retry-delay 1 --max-time 4 http://127.0.0.1:8000/api/health; then
            docker compose -p amc-acceptance logs --tail 40 api migrate
            exit 1
          fi
          docker compose -p amc-acceptance exec -T api python -m pip freeze > compose-versions.txt
          docker compose -p amc-acceptance images >> compose-versions.txt
          docker image inspect postgres:16.6-alpine --format '{{json .RepoDigests}}' >> compose-versions.txt
          docker compose -p amc-acceptance run --rm migrate python migrations/apply.py --publish-registry catalog/research-strategy-v1.json
          AMC_ONBOARDING_SCREENSHOTS="$RUNNER_TEMP/onboarding" AMC_BROWSER_MAILBOX_PROJECT=amc-acceptance AMC_BROWSER_TEST_URL=http://127.0.0.1:8000 python tests/browser_delivery.py
      - uses: actions/upload-artifact@v4
        with:
          name: compose-versions${{ matrix.revision == 'integration' && '-integration' || '' }}
          path: compose-versions.txt
      - uses: actions/upload-artifact@v4
        with:
          name: onboarding-screenshots${{ matrix.revision == 'integration' && '-integration' || '' }}
          path: ${{ runner.temp }}/onboarding/*.png
          if-no-files-found: error

  workforce-model:
    strategy: *revision_strategy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: *tested_revision
      - name: Check out the previously reviewed dispatcher for the rolling upgrade
        uses: actions/checkout@v4
        with:
          ref: bae0ddeb1df5a922c82f6d5c9a2b09e46eeee728
          path: .ci/adapter-v1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.16'
      - run: python -m pip install -r requirements-dev.txt
      - name: Verify real local inference and client-approved delivery
        shell: bash
        run: |
          set -euo pipefail
          python scripts/init_env.py
          python scripts/fetch_workforce_model.py
          compose=(docker compose -p amc-workforce-test -f compose.yaml -f tests/compose_pool_database.yaml --profile local-model)
          trap 'docker compose -p amc-workforce-test --profile workforce --profile local-model down' EXIT
          "${compose[@]}" up -d --build db migrate api model
          curl --fail --retry 30 --retry-all-errors --retry-delay 1 http://127.0.0.1:8000/api/health
          "${compose[@]}" exec -T api python -c "import urllib.request,time
          for _ in range(90):
              try:
                  urllib.request.urlopen('http://model:8080/health',timeout=2).close()
                  break
              except OSError: time.sleep(2)
          else: raise RuntimeError('Model failed to start')"
          single_result=0
          python tests/workforce_compose_smoke.py || single_result=$?
          "${compose[@]}" exec -T db createdb -U amc amc_test_qwen_pool
          port="$("${compose[@]}" port db 5432 | cut -d: -f2)"
          set -a
          source .env
          set +a
          export AMC_MIGRATION_DSN="postgresql://amc:$POSTGRES_PASSWORD@127.0.0.1:$port/amc_test_qwen_pool"
          export DATABASE_URL="postgresql+psycopg://amc_runtime:$AMC_RUNTIME_PASSWORD@127.0.0.1:$port/amc_test_qwen_pool"
          export PYTHONPATH=. AMC_POOL_REPORT=pool-measurements.json AMC_TEST_PG=1
          python migrations/apply.py
          pool_result=0
          python tests/pool_model_smoke.py --docker || pool_result=$?
          AMC_POOL_REPORT=diamond-measurements.json python tests/pool_model_smoke.py --docker --workflow diamond-v1
          AMC_POOL_REPORT=dynamic-measurements.json python tests/pool_model_smoke.py --docker --workflow dynamic-v1
          parallel_compose=(docker compose -p amc-workforce-test -f compose.yaml -f tests/compose_pool_database.yaml -f tests/compose_parallel_model.yaml --profile local-model)
          "${parallel_compose[@]}" up -d --no-deps model
          model_port="$("${parallel_compose[@]}" port model 8080 | cut -d: -f2)"
          curl --fail --retry 60 --retry-all-errors --retry-delay 1 "http://127.0.0.1:$model_port/health"
          AMC_LOCAL_MODEL_URL="http://127.0.0.1:$model_port/v1" AMC_PARALLEL_REPORT=parallel-measurements.json python tests/parallel_model_smoke.py
          AMC_V1_SOURCE="$PWD/.ci/adapter-v1" AMC_SOURCE_SHA="$(git rev-parse HEAD)" \
            AMC_LOCAL_MODEL_URL="http://127.0.0.1:$model_port/v1" python tests/registry_model_smoke.py
          test "$single_result" -eq 0 && test "$pool_result" -eq 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pool-model-measurements${{ matrix.revision == 'integration' && '-integration' || '' }}
          path: |
            pool-measurements.json
            diamond-measurements.json
            dynamic-measurements.json
            parallel-measurements.json
            registry-measurements.json
            registry-rollout.json
            role-qa-measurements.json
            wait-diagnostics-measurements.json
            research-strategy-measurements.json
          if-no-files-found: ignore

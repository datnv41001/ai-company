name: Synthetic Keycloak lab
on:
  push:
    paths: ['engineering/identity-lab/**', '.github/workflows/identity-provider-lab.yml']
  pull_request:
    paths: ['engineering/identity-lab/**', '.github/workflows/identity-provider-lab.yml']
permissions:
  contents: read
jobs:
  oidc:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-browser.txt 'httpx>=0.27,<1' 'PyJWT[crypto]>=2.10,<3'
      - run: python -m playwright install --with-deps chromium
      - run: python engineering/identity-lab/run.py

services:
  database:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_DB: oidc_lab
      POSTGRES_USER: oidc_lab
      POSTGRES_PASSWORD: ${LAB_DB_PASSWORD:?generated by run.py}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oidc_lab -d oidc_lab"]
      interval: 2s
      timeout: 3s
      retries: 30
  provider:
    image: quay.io/keycloak/keycloak:26.8.2@sha256:7e66a96e4739239070aeaf72e4c5decf0f7f682cfc725b9f7ea2b336eaba38b3
    depends_on:
      database:
        condition: service_healthy
    command: ["start-dev"]
    mem_limit: 1536m
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: lab-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${LAB_ADMIN_PASSWORD:?generated by run.py}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://database:5432/oidc_lab
      KC_DB_USERNAME: oidc_lab
      KC_DB_PASSWORD: ${LAB_DB_PASSWORD}
    ports:
      - "127.0.0.1::8080"
